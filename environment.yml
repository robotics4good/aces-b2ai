name: aces-b2ai
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - jupyter
  - ipykernel
  - pip:
    # Team fork: https://github.com/robotics4good/b2aiprep — pin updates reproducible installs
    - "b2aiprep @ git+https://github.com/robotics4good/b2aiprep.git@56d22b13141aee2cc4604c23e0bd84ab436a855c"
    - pandas
    - numpy
    - librosa
    - parselmouth
    - pyworld
    - soundfile
    - tqdm
    - scikit-learn
    - xgboost
    - lightgbm
    - torch
    - matplotlib
    - seaborn
    - plotly
    - shap
    - scipy
    - statsmodels
    - datasets
    - pyarrow
    - fastparquet
    - opensmile